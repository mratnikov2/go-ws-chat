<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватный канал</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        #login-screen, #chat-screen { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        #chat-screen { display: none; height: 80vh; flex-direction: column; } 
        h1 { color: #333; margin-top: 0; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        .login-box { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        
        #chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 10px; }
        .message { max-width: 70%; padding: 10px 14px; border-radius: 12px; position: relative; word-wrap: break-word; }
        .msg-header { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .msg-time { font-size: 11px; opacity: 0.7; text-align: right; margin-top: 4px; }
        .my-message { background: #e3f2fd; color: #0d47a1; align-self: flex-end; border-bottom-right-radius: 2px; }
        .other-message { background: #f1f3f4; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }

        .input-area { display: flex; margin-top: 20px; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        button { padding: 12px 24px; background: #1e88e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1565c0; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Вход в канал</h1>
        <div class="login-box">
            <input type="text" id="username-input" placeholder="Твое имя...">
            <input type="password" id="password-input" placeholder="Секретный пароль...">
            <button onclick="joinChat()">Войти</button>
        </div>
    </div>

    <div id="chat-screen">
        <h1>Приватный канал</h1>
        <div id="chat-messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Напиши сообщение...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        let username = "";
        let ws; 

        const loginScreen = document.getElementById("login-screen");
        const chatScreen = document.getElementById("chat-screen");
        const chatMessages = document.getElementById("chat-messages");
        const msgInput = document.getElementById("msg-input");
        const usernameInput = document.getElementById("username-input");
        const passwordInput = document.getElementById("password-input");

        function joinChat() {
            const name = usernameInput.value.trim();
            const pass = passwordInput.value.trim();
            
            if (name === "" || pass === "") {
                alert("Заполни оба поля!");
                return;
            }
            
            username = name;
            
            // Стучимся на сервер и передаем пароль в адресе запроса
            const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(wsProtocol + "//" + window.location.host + "/ws?pass=" + encodeURIComponent(pass));

            // Если сервер принял пароль, пускаем в чат
            ws.onopen = function() {
                loginScreen.style.display = "none";
                chatScreen.style.display = "flex";
            };

            // Если сервер сбросил соединение (неверный пароль)
            ws.onclose = function(event) {
                if (event.code !== 1000) {
                    alert("Неверный пароль!");
                }
            };

            ws.onmessage = function(event) {
                const msg = JSON.parse(event.data);
                const msgDiv = document.createElement("div");
                
                if (msg.author === username) {
                    msgDiv.className = "message my-message";
                } else {
                    msgDiv.className = "message other-message";
                }

                msgDiv.innerHTML = `
                    <div class="msg-header">${msg.author}</div>
                    <div>${msg.text}</div>
                    <div class="msg-time">${msg.time}</div>
                `;
                
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight; 
            };
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text !== "" && ws && ws.readyState === WebSocket.OPEN) {
                const payload = JSON.stringify({ author: username, text: text });
                ws.send(payload);
                msgInput.value = "";
            }
        }

        passwordInput.addEventListener("keypress", function(e) { if (e.key === "Enter") joinChat(); });
        msgInput.addEventListener("keypress", function(e) { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
